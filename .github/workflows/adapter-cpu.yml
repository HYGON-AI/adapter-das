name: Adapter CPU

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Structure and CPU contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HCU_ADAPTER_HOST: none
      HIP_VISIBLE_DEVICES: ""
      CUDA_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install structural check dependency
        run: python -m pip install tomli
      - name: Structural checks
        run: python ci/l0_gate.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest numpy pyyaml packaging setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate manifests
        run: |
          python -m tools.l15_manifest validate tests/manifests/l15_v0522.json
          python -m tools.l15_manifest validate tests/manifests/l15_v0522_classified.json
          python -m tools.l15_family_matrix validate
          python -m tools.l16_model_readiness validate
          bash -n ci/l1_gpu_gate.sh ci/l15_readiness_gate.sh ci/l16_model_readiness_gate.sh
      - name: CPU and orchestration contracts
        run: |
          python -m pytest -q --junitxml=cpu-results.xml \
            tests/test_ops_cpu.py \
            tests/adapter/test_l1_gate_ownership.py \
            tests/adapter/test_hcu_ci_preflight.py \
            tests/adapter/test_jit_fp8_ffi.py \
            tests/adapter/test_jit_sources.py \
            tests/adapter/test_packaging.py \
            tests/adapter/test_l15_manifest.py \
            tests/adapter/test_l15_ci_plan.py \
            tests/adapter/test_l15_family_matrix.py \
            tests/adapter/test_l15_model_smoke.py \
            tests/adapter/test_l15_upgrade_check.py \
            tests/adapter/test_l16_model_readiness.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-cpu-results
          path: cpu-results.xml
          if-no-files-found: ignore
