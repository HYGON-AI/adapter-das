[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-kernel"
version = "0.1.0"
description = "Triton-backed drop-in replacement of sgl_kernel for HCU (Hygon DCU). Provides the AOT kernel backend (`import sgl_kernel`) consumed by sglang's `sglang.kernels` fused-op layer, so upstream sglang runs on HCU without any code modification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "packaging>=23",
    "torch>=2.0",
    "triton>=2.1",
]

[project.entry-points."vllm.platform_plugins"]
hcu_adapter = "hcu_adapter.bridges.vllm:hcu_platform_plugin"

[project.entry-points."vllm.general_plugins"]
hcu_adapter = "hcu_adapter.bridges.vllm:hcu_runtime_plugin"

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.packages.find]
include = ["hcu_adapter*", "sgl_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
