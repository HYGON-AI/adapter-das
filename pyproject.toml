[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-kernel"
# single source: sgl_kernel/version.py (governance §7.4); the hcu-adapter
# dist in packaging/hcu-adapter pins this exact version.
dynamic = ["version"]
description = "HCU shadow sgl_kernel for Hygon HCU (sglang ABI-contract kernels; part of adapter-das)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "packaging>=23",
    "torch>=2.0",
    "triton>=2.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "tomli>=1.1; python_version < '3.11'",
]

[tool.setuptools.dynamic]
version = {attr = "sgl_kernel.version.__version__"}

[tool.setuptools.packages.find]
include = ["sgl_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
